# =========================
# Server
# =========================
server.port=${PORT:8080}

# =========================
# PostgreSQL (Neon)
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate & SQL Init
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================
# JWT
# =========================
application.security.jwt.secret-key=ZmlsZS1jYXJlZXJvcy1zZWN1cml0eS1rZXkta2V5LWZvci1hdXRoZW50aWNhdGlvbi1wdXJwb3Nlc29ubHk=
application.security.jwt.expiration=86400000

# =========================
# File Upload
# =========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
application.resume.upload-dir=uploads

# =========================
# Mail / SMTP (Gmail / SMTP Server)
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
application.mail.from=${MAIL_FROM:noreply@careeros.com}

# =========================
# Google OAuth
# =========================
google.client-id=${GOOGLE_CLIENT_ID:}