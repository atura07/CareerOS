# =========================
# Server & Port Binding
# =========================
server.port=${PORT:8080}
server.address=0.0.0.0

# =========================
# PostgreSQL (Neon) & HikariCP Pool Tuning
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=CareerOSHikariPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# =========================
# JPA / Hibernate & SQL Init
# =========================
# Schema migration is handled efficiently pre-JPA by DatabaseMigrationRunner
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT Authentication
# =========================
application.security.jwt.secret-key=ZmlsZS1jYXJlZXJvcy1zZWN1cml0eS1rZXkta2V5LWZvci1hdXRoZW50aWNhdGlvbi1wdXJwb3Nlc29ubHk=
application.security.jwt.expiration=86400000

# =========================
# File Upload
# =========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
application.resume.upload-dir=uploads

# =========================
# Email Service (Resend HTTP API)
# =========================
application.resend.api-key=${RESEND_API_KEY:}
application.mail.from=${MAIL_FROM:onboarding@resend.dev}

# =========================
# Google OAuth
# =========================
google.client-id=${GOOGLE_CLIENT_ID:}

# =========================
# OpenAI API (Conversational Mock Interview)
# =========================
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-seconds=45